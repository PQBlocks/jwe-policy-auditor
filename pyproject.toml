[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-jwe-audit"
version = "0.1.0"
description = "High-throughput JSON Web Encryption (JWE) cryptographic policy auditor enforcing CNSA 2.0 and NIST FIPS 203 PQC standards."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "jwe", "jose", "jwt", "cnsa", "fips-203", "audit", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/jwe-policy-auditor"
Documentation = "https://github.com/PQBlocks/jwe-policy-auditor#readme"
Source = "https://github.com/PQBlocks/jwe-policy-auditor"
Changelog = "https://github.com/PQBlocks/jwe-policy-auditor/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/jwe-policy-auditor/issues"
Security = "https://github.com/PQBlocks/jwe-policy-auditor/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
